name: Cloudflare build verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      # No database service or production credentials are available in this job.
      # Any accidental query must fail against this local, unused endpoint.
      DATABASE_URL: postgresql://build:build@127.0.0.1:1/build?connect_timeout=1
      # Syntactically valid placeholder; it is not a real Clerk instance.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5pbnZhbGlkJA==
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /repartition
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /repartition
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject environment files in the checkout
        shell: bash
        run: |
          if find . -type f \( -name '.env' -o -name '.env.*' -o -name '.dev.vars' -o -name '.dev.vars.*' \) -print -quit | grep -q .; then
            echo '::error::Environment files are forbidden in this build-only checkout. Remove them from Git; use the CI placeholders.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx --no-install prisma generate
      - run: npm run lint
      - name: Build Next.js for Cloudflare
        run: npx --no-install opennextjs-cloudflare build
      - name: Validate Worker bundle without deploying
        run: npx --no-install wrangler deploy --dry-run --outdir .wrangler/ci-dry-run
      - name: Save Cloudflare Worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: pedagoplus-ai-cloudflare
          path: |
            .open-next
            .wrangler/ci-dry-run
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
